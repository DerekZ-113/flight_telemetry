# Continuous integration (REQ-TEST-003, REQ-TEST-004).
#
# Two jobs, each on a clean Ubuntu machine, every push. The first is the
# pass/fail criteria in docs/test_plan.md section 4, in order: the build
# must be warning-free, every Google Test must pass, every pytest must pass
# (REQ-TEST-002; the suite drives the instrumented binary, so its runs
# count toward the coverage captured next, test_plan.md 6.1), branch
# coverage must meet the section 6.3 thresholds, and cppcheck must report
# zero findings on a release tag (it reports without blocking on ordinary
# pushes). The second runs the dashboard page's tests and its build
# (test_plan.md 2.5) in parallel, so the C++ job's wall time is unchanged.
#
# GCC + libstdc++ here, clang + libc++ on the development Mac. Tests pass
# on both because each compares a run to itself or to physics with a
# tolerance; the floating-point decimals differ, as design.md section 8
# says they will.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-test-coverage:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from
    # 2026-10-19: the record's GCC 13.3, lcov 2.0 and cppcheck 2.13 are this
    # image's, so a newer image is a decision of its own, its expectations
    # written first (FTS-VR-001 Entry 26 §26.6).
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # the whole job runs in about three; a hung receiver must not run for six hours

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        # libzmq3-dev is the ZeroMQ C library the transport links
        # (REQ-TRANS-001); its C++ wrapper is fetched by CMake, pinned.
        # libcurl4-openssl-dev is the HTTP client the ADS-B source links
        # (REQ-SENS-008); its JSON parser is fetched by CMake, pinned.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake lcov cppcheck libzmq3-dev libcurl4-openssl-dev

      - name: Configure (warnings as errors, coverage on)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DWARNINGS_AS_ERRORS=ON
          -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Set up Python
        # The pins in requirements.txt were resolved against 3.13, the
        # development venv; the runner gets the same interpreter.
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the Python side
        # pyzmq, numpy, matplotlib, pytest, and websockets for the bridge
        # (REQ-DISP-005), all pinned.
        run: pip install -r requirements.txt

      - name: Integration tests
        # Section 4 criterion 2. pytest runs build/telemetry about twenty
        # times (one simulated session, the transport runs, the replay's end
        # and its pacing, the session status, the bridge end to end); the
        # binary is the instrumented telemetry_core, so these runs add their
        # counts to the .gcda files the unit tests wrote (test_plan.md 6.1).
        # -rA: the summary carries each passing test's captured prints
        # (the transport tests' join index and stall counts), which the
        # verification record quotes from this log.
        run: python -m pytest -rA

      - name: Coverage report
        run: |
          mkdir -p coverage
          # Capture everything the tests touched, then drop what is not
          # ours to measure: gtest sources, the tests themselves, system
          # headers, and main.cpp (composition root, no test by design;
          # test_plan.md 6.2). --filter branch removes compiler-generated
          # exception-handling branches so the number reflects our
          # decisions, not the standard library's unwind paths.
          # --ignore-errors: lcov 2.x validates gcov's per-function line
          # ranges and rejects the bodies Google Test's TEST() macro
          # generates ("mismatched end line"). Those files are removed
          # from the report on the next line anyway, so the check adds
          # nothing here. 'inconsistent' and 'unused' cover the same
          # class of strictness on library headers and unmatched patterns.
          #
          # '--filter branch' strips exception-unwind edges only from lines
          # with no conditional, so the source keeps every call that can
          # throw on a line of its own (CLAUDE.md); the loop lines whose
          # calls cannot leave the condition carry a
          # LCOV_EXCL_EXCEPTION_BR_LINE marker instead
          # (verification_results.md §1.3). Do not add
          # '--rc no_exception_branch=1': on the runner's lcov 2.0 it
          # discards nearly every branch (run 34444099506, reproduced in
          # a container in 5.6).
          lcov --rc branch_coverage=1 --directory build --capture \
               --ignore-errors mismatch,inconsistent,unused \
               --output-file coverage/raw.info
          lcov --rc branch_coverage=1 \
               --ignore-errors inconsistent,unused \
               --remove coverage/raw.info '*/_deps/*' '*/tests/*' '*/src/main.cpp' '/usr/*' \
               --filter branch \
               --output-file coverage/lcov.info
          lcov --rc branch_coverage=1 --summary coverage/lcov.info
          genhtml --rc branch_coverage=1 --branch-coverage \
                  coverage/lcov.info --output-directory coverage/html

      - name: Coverage thresholds
        run: scripts/coverage_check.sh coverage/lcov.info

      - name: Static analysis (report)
        run: |
          mkdir -p static_analysis
          cppcheck --enable=warning,style,performance,portability --std=c++17 \
                   --suppress=missingIncludeSystem --inline-suppr -I src src \
                   2>&1 | tee static_analysis/cppcheck.txt

      - name: Static analysis (gate on release tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: >
          cppcheck --enable=warning,style,performance,portability --std=c++17
          --suppress=missingIncludeSystem --inline-suppr --error-exitcode=1 -I src src

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html

      - name: Upload cppcheck report
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck
          path: static_analysis/cppcheck.txt

  page:
    # The dashboard (REQ-DISP-003, REQ-DISP-004): Vitest with jsdom, then
    # the TypeScript check and the production build. Reported coverage,
    # not gated (test_plan.md 6.3): the gate of record is gcov/lcov over
    # src/. Node 22 is the LTS the development Mac runs; the lockfile pins
    # every package, so npm ci installs exactly what was tested.
    runs-on: ubuntu-24.04   # pinned with the C++ job, for the same reason
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install the page's packages
        run: npm ci --no-audit --no-fund

      - name: Page tests (with coverage)
        run: npm test -- --run --coverage

      - name: Type check and build
        run: npm run build

      - name: Upload page coverage
        uses: actions/upload-artifact@v4
        with:
          name: page-coverage
          path: dashboard/coverage/coverage-summary.json
